<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylecart.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Clover - Cart</title>
</head>
<body>
     <header class="header">
        <div class="left">
            <a href="about.html" class="brand" aria-label="Home">
                <img src="img/clover.png" alt="Clover logo" class="logo">
            </a>
        </div>
        <nav class="right">
            <a href="index.html">Home</a>
            <a href="catalog.html">Perfumes</a>
            <a href="compare.html">Compare</a>
            <a href="account.html">Account</a>
        </nav>
    </header>

    <div class="floating-cart">
        <span id="cart-count" class="cart-badge">0</span>
        <a href="cart.html" class="cart-link"><i class="material-icons">shopping_cart</i></a>
    </div>

    <br><br>
    <h1 class="cart-title">Checkout</h1>


<br><br><br>
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-brand">
                <img src="img/clover.png" alt="Clover logo" class="footer-logo">
                <p>Small-batch fragrance, built note by note.</p>
            </div>

            <nav class="footer-nav">
                <p class="footer-heading">Shop</p>
                <a href="index.html">Home</a>
                <a href="catalog.html">Perfumes</a>
                <a href="compare.html">Compare</a>
                <a href="cart.html">Cart</a>
                <a href="about.html">About</a>
            </nav>

            <form class="footer-signup" id="signupForm">
                <p class="footer-heading">Stay in the loop</p>
                <p class="footer-sub">New releases and restocks, no spam.</p>
                <div class="signup-row">
                    <label for="signupEmail" class="sr-only">Email address</label>
                    <input type="email" id="signupEmail" placeholder="you@email.com" required>
                    <button type="submit">Join</button>
                </div>
                <p class="signup-note" id="signupNote" aria-live="polite"></p>
            </form>
        </div>

        <div class="footer-bottom">
            <span>&copy; 2026 Clover Perfumery. All rights reserved.</span>
        </div>
    </footer>

    <script src="products.js"></script>
    <script src="store.js"></script>
    <script src="cart.js"></script>
</body>
</html>
